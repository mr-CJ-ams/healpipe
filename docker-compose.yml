services:
  api:
    build: .
    environment:
      HEALPIPE_PROCESS_ROLE: api
      PORT: 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m database.init_db && python -m uvicorn main:app --host 0.0.0.0 --port $${PORT:-8000}"]

  worker:
    build: .
    environment:
      HEALPIPE_PROCESS_ROLE: worker
      DELIVERY_WORKER_COUNT: 2
    env_file:
      - .env
    command: ["python", "-m", "worker"]
